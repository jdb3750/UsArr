<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!--
			The UI face, self-hosted and preloaded. `font-display: block` means text
			set in Plex is invisible until the face arrives, so the fetch is started
			with the document rather than after the stylesheet has been parsed.
			`crossorigin` is required on a font preload even same-origin: without it
			the preload is fetched in a different mode from the @font-face request
			and the file is downloaded twice. Only the Sans face is preloaded — Mono
			is machine data and appears on a fraction of the screens.
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/PlexSans-var-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<!--
			`display: contents` on this wrapper comes from app.css, not from a style
			attribute. The server sends `style-src 'self'` with no 'unsafe-inline'
			(internal/httpapi/middleware.go), and a style attribute under that header
			is refused: the attribute stays in the DOM, the wrapper silently became a
			block box, and nothing in the rendered page said why.

			⚠️ "REFUSED" IS NOT ONE BEHAVIOUR, AND THE EARLIER WORDING HERE — that a
			refused attribute "applies nothing" — IS FALSE FOR ONE OF THE TWO PATHS.
			Measured A/B under this exact header: `setAttribute` is reported AND
			blocked; `template.innerHTML` + clone, which is Svelte 5's own path, is
			reported AND APPLIED; `el.style.setProperty()` is not reported at all. So
			a console violation does not establish that the declaration did nothing,
			and the sibling note in app.css corrects the same premise where it had
			produced a wrong conclusion about the route announcer.

			THE GUIDANCE IS UNCHANGED AND IS NOW THE ONLY SAFE PATH: write custom
			properties and dynamic values with `el.style.setProperty()`, which
			neither reports a violation nor risks being blocked, and put everything
			else in a class. `$lib/list.ts` says the same thing at the call site.

			TWO METHOD NOTES, because they cost two attempts each. The policy carries
			no `report-sample`, so a violation record has an empty sample, no
			`sourceFile`, and line numbers that move with unrelated script length —
			the console HASH was the only usable identifier. And a `setAttribute`
			hook or a `MutationObserver` with `attributeFilter: ['style']` reads as
			ABSENCE on the clone path, which is why an early probe returned a count
			and no element.
		-->
		<div id="usarr-root">%sveltekit.body%</div>
	</body>
</html>
