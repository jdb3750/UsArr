---
# SYNTHETIC — hand-authored from api/specs/kavita-develop.json (VolumeDto,
# ChapterDto, MangaFileDto) and NOT a wire capture. Claimed Kavita version:
# 0.9.0.20.
#
# It answers GET /api/Series/volumes for EVERY series id the other libsync
# cassettes stream, so the file walk runs end to end wherever a full import does.
#
# Three things this fixture carries on purpose:
#
#  1. `files[]` IS POPULATED ON EVERY CHAPTER. That is the shape a live probe
#     against the owner's Kavita 0.9.0.2 measured — 90 of 90 sampled chapters
#     carried a non-empty files array, none was null — and it is what makes the
#     walk one request per series rather than one per chapter.
#  2. `filePath` IS A REAL-LOOKING HOST PATH ON EVERY FILE, and it is here to be
#     REFUSED. media_file.path stores an opaque surrogate
#     (`kavita:mangafile:<id>`, owner decision 2026-08-18); a fixture with empty
#     filePaths would let a regression that stores them pass unnoticed, which is
#     the "guard green while the thing is broken" failure this repo keeps
#     finding.
#  3. THE EXTENSIONS ARE THE EDITION DECISION. MangaFormat.Archive covers both
#     'cbz' and 'cbr', so the walked files' extension is what settles it —
#     series 41 is .cbz, series 42 is .cbr, and series 105 is loose images whose
#     format has no member in edition.format's vocabulary at all.
#
# Unread properties are omitted rather than filled with defaults: encoding/json
# leaves an absent property at its zero value, which is exactly what a real
# response's unread fields decode to anyway, and the struct-vs-spec coverage that
# an omission WOULD hide is asserted directly by
# internal/kavita/contract_test.go's TestStructsCoverSpecProperties.
