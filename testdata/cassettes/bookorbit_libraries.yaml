---
# SYNTHETIC — hand-authored from bookorbit/bookorbit@73b7877d
# (auth.controller.ts's @Post('magic-links/login'), AuthService.issueTokensForUser
# and buildUserResponse, library.controller.ts's @Get(), LibraryService.findAll
# and LibraryRepository.findAllForUser). NOT a wire capture, and no live
# BookOrbit was contacted — ADR-0052 records that this project has never probed
# one, and inventing a capture would be worse than saying so.
#
# 🚩 THE LIBRARY OBJECTS BELOW ARE THE NON-SUPERUSER PROJECTION, WHICH IS THE
# POINT OF THE FIXTURE. LibraryService.findAll branches on user.isSuperuser: a
# superuser gets LibraryRepository.findAll, which is `...getTableColumns(libraries)`
# — the whole row, allowedFormats and formatPriority and organizationMode
# included. UsArr's credential is a SHARED VIEWER account by design
# (internal/bookorbit/scope.go), so it gets findAllForUser instead, whose select
# list is exactly id, name, icon, displayOrder, coverAspectRatio, scanMode,
# fileRenameEnabled, createdAt, updatedAt and bookCount — plus the `folders`
# array the service attaches afterwards. A fixture written from the superuser
# shape would let this client depend on fields that are absent in production.
#
# `folders` is here BECAUSE it must be seen not to cross the package boundary: it
# is a list of host filesystem paths on the BookOrbit box, it has no reader
# anywhere in UsArr, and bookorbit.Library deliberately has no field for it.
#
# TWO INTERACTIONS, in the order the client produces them: the mint, then the
# read. Both credentials replay as `<redacted>` and that is the scrubber working
# — see bookorbit_app_info.yaml's header for the whole argument, including the
# one path a cassette cannot exercise.
version: 2
