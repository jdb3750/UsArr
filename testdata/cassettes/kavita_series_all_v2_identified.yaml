# SYNTHETIC — hand-authored from api/specs/kavita.json (develop @ 9c3e540,
# SeriesDto) and Kavita.Server/Controllers/SeriesController.cs at the same
# commit. NOT a wire capture. Claimed Kavita version: 0.9.0.20.
#
# WHY THIS FIXTURE EXISTS ALONGSIDE kavita_series_all_v2.yaml: that one is the
# ORDINARY case — every Kavita+ identifier 0, null or "" — which is what a free
# instance returns and what ARCHITECTURE.md §6.4 calls the ordinary case. This
# one is the OPPOSITE and constructed to fire four paths that a free instance
# never reaches:
#
#   1. TWO SERIES CLAIMING THE SAME aniListId (30013). That is a
#      ux_extid_work_strong violation, which migration 0005 calls "the merge
#      signal, not an error". v0.1 has no work_merge table.
#   2. mangaBakaEditionId SET on series 103. It is an EDITION identifier and
#      must not be written as a work identity (§6.4 amendment 4).
#   3. A series in a DECLINED library (id 4, LibraryType 3 Image). No work row
#      may exist for it.
#   4. A LIGHT NOVEL library (id 5, LibraryType 4) and a COMIC VINE library
#      (id 6, LibraryType 5), which the two-library fixture does not carry.
#
# ⚠️ NO REAL INSTANCE IS KNOWN TO LOOK LIKE THIS. It pairs with
# kavita_libraries_all_types.yaml and is a constructed shape, not evidence about
# any install. Only a live capture could be that.
#
# It carries NO Pagination header, deliberately: the header is middleware, it is
# not in the OpenAPI document, and a reverse proxy that strips unknown headers
# must degrade to "total unknown" rather than fail the read.
