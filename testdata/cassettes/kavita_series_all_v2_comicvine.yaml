# SYNTHETIC — hand-authored from api/specs/kavita.json (develop @ 9c3e540,
# SeriesDto) and from Kavita's own source at tag v0.9.0.2. NOT a wire capture.
# Claimed Kavita version: 0.9.0.2 — the OWNER'S version (ADR-0035 §2a).
#
# WHY THIS FIXTURE EXISTS: every OTHER series cassette here was authored on the
# premise that SeriesDto's identifier fields "are written only by the Kavita+
# match path". THAT PREMISE IS FALSE FOR TAGGED COMICS. A whole-tree grep of
# Kavita v0.9.0.2 for `ComicVineId` finds exactly three writers of
# Series.ComicVineId, and none of them is behind a licence check:
#
#   Kavita.Services/Scanner/ProcessSeries.cs:162          the plain scanner
#   Kavita.Services/Scanner/ProcessSeries.cs:365          the plain scanner, inherit branch
#   Kavita.Server/Helpers/ExternalMetadataIdHelper.cs:38  the Edit Series dialog
#
# So a FREE Kavita over a ComicTagger- or Mylar-tagged library populates this
# field, and every value in it was parsed out of ComicInfo.xml's free-text <Web>
# element or typed by a user.
#
# ⚠️ THE VALUE SHAPES BELOW ARE THE POINT, and each is justified from source:
#
#   201  "112794"                      A BARE ID in a library with the inherit flag
#                                      OFF. This is what Kavita's scanner leaves:
#                                      WeblinkParser.cs:55-61 returns
#                                      `extractedId.Split('-')[1]`, i.e. the id with
#                                      its 4050/4000 PREFIX STRIPPED. Kavita's own
#                                      test pins it — WeblinkParserTests.cs:24 expects
#                                      ".../4000-159233/" -> "159233". With the flag
#                                      off the only scanner path that can have written
#                                      it is ProcessSeries.cs:162, fed by
#                                      DefaultParser.cs:169-172's 4050-ONLY branch, so
#                                      this is a VOLUME id.
#
#   202  a full 4050 ComicVine URL     A user pasted the link into Edit Series.
#                                      ExternalMetadataIdHelper.cs:36-38 stores the
#                                      string VERBATIM after a whitespace check and
#                                      nothing else, so a URL really does survive into
#                                      this field. The 4050 discriminator is intact.
#
#   203  a full 4000 ComicVine URL     The same route with an ISSUE link. This is the
#                                      shape ComicTagger writes into <Web> for a single
#                                      issue. An issue is one level BELOW the work.
#
#   204  "159233", inherit flag ON     🚩 THE TRAP. Library 11 has
#                                      inheritWebLinksFromFirstChapter enabled, so
#                                      ProcessSeries.cs:365 overwrote
#                                      series.ComicVineId with
#                                      `GetComicVineId(firstChapter.WebLinks).Item1`
#                                      and DISCARDED Item2 — the only surviving
#                                      volume/issue discriminator. The value here IS
#                                      the first chapter's issue id and the DTO cannot
#                                      say so. 159233 is Kavita's own test's issue id.
#
#   205  every id null                 The control: a plain untagged EPUB in a Book
#                                      library. Degraded identity, the ordinary case,
#                                      and it must stay that way.
#
# ⚠️ NO REAL INSTANCE IS KNOWN TO LOOK LIKE THIS. It is constructed to fire code
# paths and pairs with kavita_libraries_comicvine.yaml. Only a live capture is
# evidence about a live server.
#
# It carries NO Pagination header, deliberately — see the sibling cassettes.
