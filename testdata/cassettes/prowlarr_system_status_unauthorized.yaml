---
# A wrong or missing key returns 401 with an EMPTY BODY -- never 403, and never
# a JSON error envelope. Parsing it yields 'unexpected end of JSON input', which
# hides the real cause, so the decoder short-circuits on the status.
version: 2
interactions:
    - id: 0
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: prowlarr.test:9696
        headers:
            Accept:
                - application/json, text/plain;q=0.9, */*;q=0.1
            X-Api-Key:
                - <redacted>
        url: http://prowlarr.test:9696/api/v1/system/status
        method: GET
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: -1
        headers:
            X-Application-Version:
                - 2.6.2.5052
        status: 401 Unauthorized
        code: 401
        duration: 1ms
        body: ""
