# SYNTHETIC — hand-authored from bookorbit/bookorbit@73b7877d
# (auth.controller.ts's @Post('magic-links/login'), library.controller.ts's
# @Post(':id/books'), BookService.queryForLibrary, BooksPage and BookCard in
# packages/types/src/book.ts, and book/utils/assemble-book-cards.ts, which is
# what actually builds each card). NOT a wire capture; no live BookOrbit was
# contacted.
#
# THREE CARDS, ONE PER MEDIA KIND THE MAPPING HAS TO TELL APART, because a
# fixture of three ebooks would prove that the walk decodes and nothing about the
# decision it exists to make:
#
#   * 101 The Hobbit  — files[0].format 'epub'  -> getBookMediaKind 'ebook'
#   * 102 Project Hail Mary — 'm4b'             -> 'audiobook'
#   * 103 Saga, Vol. 1 — 'cbz'                  -> 'comic', which slice 1 SKIPS
#
# The three per-user fields are present and populated on purpose — readStatus,
# readingProgress and rating are the reading state of the BookOrbit ACCOUNT UsArr
# borrows, and the projection must be seen to drop them rather than merely not
# to want them.
#
# A THIRD INTERACTION SERVES LIBRARY 2 AN EMPTY PAGE, and it is not padding: it
# is what an account granted a library it can see and that holds nothing looks
# like, and it keeps the fixture honest against bookorbit_libraries.yaml, which
# names two libraries. A walk that skipped a container because the cassette had
# nothing for it would be testing the harness, not the adapter.
#
# ⚠️ ONE PAGE PER LIBRARY, AND THE PAGING LOOP IS THEREFORE NOT EXERCISED HERE. The walk
# stops on a SHORT page, so a cassette that crossed a page boundary would need
# 200 cards in its first interaction — a fixture nobody would read. The boundary
# is crossed against the local fake in internal/bookorbit/catalogue_test.go
# instead, over real HTTP with a generated library. Said out loud because a
# reader could otherwise take this file for coverage it does not give.
#
# Note also what the go-vcr matcher does and does not do: it matches on method
# plus REDACTED URL and NOT on the request body (internal/vcrscrub's Matcher says
# why), so two page requests to this same path would replay in recorded order
# rather than by their bodies. That is a property to design a fixture around, not
# one to lean on.
