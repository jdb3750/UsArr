# SYNTHETIC — hand-authored from api/specs/kavita-develop.json (develop @ 9c3e540,
# SeriesDto) and Kavita.Server/Controllers/SeriesController.cs +
# Kavita.Server/Extensions/HttpExtensions.cs at the same commit. NOT a wire
# capture. Claimed Kavita version: 0.9.0.20.
#
# Two facts this fixture carries that the OpenAPI document does not:
#
#  1. THE Pagination RESPONSE HEADER. It is middleware
#     (HttpExtensions.AddPaginationHeader serialises Kavita.Common.Helpers.
#     PaginationHeader with a camelCase policy) and appears nowhere in the spec.
#     The client reads it when present and never requires it.
#  2. THE CLOCK CLUSTER. The three lastChapterAddedUtc values below sit within
#     microseconds of each other at 07:00:30, which is what ADR-0035 §2a measured
#     on the owner's live instance: Kavita's watermark moves on the SCAN JOB's
#     clock, not on the moment each chapter appeared. It is the reason
#     ARCHITECTURE.md §7.1a's overlap window is not optional, and it is
#     reproduced here so a walk that resumes exactly at the watermark can be seen
#     dropping siblings.
#
# The external ids are 0 / null / "" throughout. That is not laziness: they are
# written only by the Kavita+ match path, so on a free instance degraded identity
# is the ORDINARY case (ARCHITECTURE.md §6.4, ADR-0035 §1).
