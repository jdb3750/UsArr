---
# SYNTHETIC — hand-authored from api/specs/kavita-develop.json
# (SeriesMetadataDto) and NOT a wire capture. Claimed Kavita version: 0.9.0.20.
#
# ⚠️ IT EXISTS BECAUSE THE CREDIT PASS WAS SILENTLY DEAD IN EVERY END-TO-END
# TEST. Before this file, no cassette answered GET /api/Series/metadata, so
# StreamCredits's "a per-series failure is DROPPED, not fatal" rule swallowed one
# cassette miss per series and every full-import test ran with a credit phase
# that read nothing. The tests passed because none of them asserted a credit —
# and the failures were also feeding the circuit breaker, so a fifth series
# opened it. REVIEW-LOG.md LS-232.
#
# The person arrays are EMPTY on purpose. This fixture's job is to let the credit
# pass SUCCEED, not to re-test the mapping — internal/libsync/credits_test.go
# owns that against hand-built DTOs, where a role table is readable. An empty
# array is also the honest ordinary case: a Kavita whose operator never filled in
# any ComicInfo returns exactly this.
#
# publicationStatus and totalCount ARE varied, and they are the reason this file
# has per-series bodies rather than one shared body: they are the availability
# rollup's denominator gate (ARCHITECTURE §6.1 — show a fraction only when the
# series has ENDED and a total is declared), and whether a free instance
# populates either of them has never been measured. Series 42 is Completed with a
# declared total, 77 is Ended with one, and everything else is OnGoing with
# totalCount 0 — which is ALSO what an instance that populates neither looks
# like, because both fields' "unset" value is 0.
