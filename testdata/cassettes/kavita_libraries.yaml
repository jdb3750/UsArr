# SYNTHETIC — hand-authored from api/specs/kavita-develop.json (develop @ 9c3e540,
# LibraryDto) and Kavita.Server/Controllers/LibraryController.cs at the same
# commit. NOT a wire capture. Claimed Kavita version: 0.9.0.20.
#
# GET /api/Library/libraries is the CREDENTIAL HANDSHAKE. LibraryController is
# [Authorize] at class level and this action carries no admin policy, so it
# answers for any valid Auth Key and 401s for an invalid one — which is what
# ServerInfo cannot do for a non-admin.
#
# The two libraries here are the shape ADR-0041 puts in v0.1: an Ebooks library
# and a Comics/manga one, which §17.8 binds a user-defined UsArr library to.
# folders[] is a HOST FILESYSTEM PATH and is why LibraryView exists.
