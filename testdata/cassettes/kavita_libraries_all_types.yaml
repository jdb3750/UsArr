# SYNTHETIC — hand-authored from api/specs/kavita.json (develop @ 9c3e540,
# LibraryDto + LibraryType) and Kavita.Server/Controllers/LibraryController.cs at
# the same commit. NOT a wire capture. Claimed Kavita version: 0.9.0.20.
#
# WHY THIS FIXTURE EXISTS ALONGSIDE kavita_libraries.yaml: that one carries the
# TWO library types an ordinary install has (Manga and Book), which is the right
# shape for the happy path and the wrong shape for a mapping test. This one
# carries ONE LIBRARY OF EVERY LibraryType MEMBER the vendored spec declares —
# 0 Manga, 1 Comic (Flexible), 2 Book, 3 Image, 4 Light Novel, 5 Comic
# (ComicVine) — so mapLibraryType is exercised on all six, including the one it
# DECLINES (Image, which has no work.kind).
#
# ⚠️ NO INSTANCE IS KNOWN TO CARRY ALL SIX. This is a constructed shape, not a
# claim about any install, and it is here to fire code paths rather than to
# describe reality. That is exactly the limit a synthetic cassette has.
