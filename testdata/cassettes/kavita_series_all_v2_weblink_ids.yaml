# SYNTHETIC — hand-authored from api/specs/kavita.json (develop @ 9c3e540,
# SeriesDto) and from Kavita's source at tag v0.9.0.2. NOT a wire capture.
# Claimed Kavita version: 0.9.0.2 — the OWNER'S version (ADR-0035 §2a).
#
# WHY THIS FIXTURE EXISTS: it is the smallest series list that fires every
# AniList / MyAnimeList / MangaBaka path §6.4 amendment 3 now reaches, against
# the three provenance regimes kavita_libraries_weblink_ids.yaml separates. Each
# series exists to fail a specific way if the cap is removed:
#
#   301 (lib 20, flag OFF)  aniListId 30002 + malId 2 — Berserk. AniList 30002
#       and MAL manga 2 are the REAL ids for it, checked 2026-08-17 against
#       https://graphql.anilist.co: Media(idMal: 2, type: MANGA) returns
#       {id 30002, "Berserk"}. Two ids on one series, so the pair is exercised.
#   302 (lib 21, flag ON)   aniListId 30002 — THE MERGE CASE. It claims THE SAME
#       AniList id as 301 while being a different series, which is exactly what a
#       physical/deluxe re-release looks like to Kavita. At confidence 1.0 the
#       second write hits ux_extid_work_strong, store.ApplyCatalogueBatch reuses
#       the first work, AND THE TWO BECOME ONE — with no work_merge table in v0.1
#       to undo it. At 0.90 they stay two.
#   303 (lib 21, flag ON)   mangaBakaId 3391 — the only field of the three with
#       NO provider writer anywhere in Kavita v0.9.0.2, in the only library
#       regime whose scanner can write it. https://mangabaka.org/3391 is a real
#       series page (checked 2026-08-17), which is the URL shape
#       WeblinkParser.cs:88-91 reads.
#   304 (lib 22, flag OFF)  malId 1 — ⚠️ THE NAMESPACE CASE, in a Book library,
#       which ExternalMetadataService.cs:55-56 excludes from Kavita+ entirely.
#       MAL id 1 names TWO DIFFERENT WORKS in two different number spaces —
#       myanimelist.net/anime/1 is "Cowboy Bebop" and /manga/1 is "Monster",
#       both fetched first-party 2026-08-17 — so this row is only unambiguous
#       because the source string says which space it is in.
#   305 (lib 22, flag OFF)  every id zero. The untagged control: a work is still
#       written, filed and searchable, and §6.4's "not identified" state is the
#       ABSENCE of an external_id row rather than an error.
#
# comicVineId is null on all five deliberately. That path has its own fixture
# pair and mixing them would make a failure ambiguous about which rule broke.
#
# It carries NO Pagination header: the header is middleware, it is not in the
# OpenAPI document, and a proxy that strips unknown headers must degrade to
# "total unknown" rather than fail the read.
