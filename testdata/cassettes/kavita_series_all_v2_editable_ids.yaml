---
# SYNTHETIC — hand-authored from api/specs/kavita-develop.json (develop @
# 9c3e540, SeriesDto). NOT a wire capture. Claimed Kavita version: 0.9.0.20
# (develop, ADR-0046's CEILING) — see kavita_libraries_editable_ids.yaml for why
# this pair claims the ceiling where the other two claim the owner's tag.
#
# WHY THIS FIXTURE EXISTS: it is the smallest series list that fires every
# metronId and cbrId path §6.4 amendment 3 now reaches, and — the part a unit
# test cannot reach — it makes each field's MERGE consequence observable in the
# database. Each series exists to fail a specific way if the cap comes off:
#
#   401 (lib 30)  metronId 156409 — the value from Kavita's OWN doc comment for
#       the regex that reads it (Parser.cs:722-726 at v0.9.0.2, verbatim:
#       "Tagged with MetronTagger-4.4.0 using info from Metron on 2025-12-24
#       12:32:18. [issue_id:156409]"). It is used here deliberately: it is the
#       number a real tagged file carries, it is an ISSUE id, and it is exactly
#       what a user copies into the Edit Series dialog's untyped "Metron Id" box
#       when the only Metron number they have ever seen is that one.
#   402 (lib 30)  metronId 156409 — 🚩 THE METRON MERGE CASE. The SAME id on a
#       different series, which is what two volumes of one run look like when
#       both were tagged from the same issue's notes. At confidence 1.0 the
#       second write hits ux_extid_work_strong, store.ApplyCatalogueBatch reuses
#       the first work, AND THE TWO BECOME ONE — with no work_merge table in
#       v0.1 to undo it. At 0.90 they stay two.
#   403 (lib 31)  cbrId 7 — the ComicBookRoundup path in a ComicVine library,
#       which KavitaPlusConfiguration offers that provider to. comicVineId is
#       null on it ON PURPOSE: a ComicVine library is where the two ids are most
#       likely to be confused for each other, and a row carrying both would make
#       a failure ambiguous about which rule broke.
#   404 (lib 31)  cbrId 7 — 🚩 THE CBR MERGE CASE, the same shape as 402. Both
#       fields get their own, because they are capped by one constant and a
#       single merge fixture would let one of them regress unobserved.
#   405 (lib 30)  every id zero. The untagged control: a work is still written,
#       filed and searchable, and §6.4's "not identified" state is the ABSENCE
#       of an external_id row rather than an error.
#
# hardcoverId is 0 on all five. It is the one field still written at 1.0
# (kavitaExternalIDs decision 5) and its presence here would put a genuinely
# work-strong row in the same fixture as the two being capped, which is the
# ambiguity the paragraph above declines for comicVineId.
#
# It carries NO Pagination header: the header is middleware, it is not in the
# OpenAPI document, and a proxy that strips unknown headers must degrade to
# "total unknown" rather than fail the read.
