# golangci-lint v2 configuration.
#
# v2 binaries cannot parse a v1 config, so `version: "2"` is mandatory and
# `linters.default` replaces v1's enable-all/disable-all.
# Source of truth for this list: docs/DEVELOPMENT.md §9.
version: "2"

# BUILD TAGS THE LINTER MUST SEE. golangci-lint analyses ONE build context, and
# by default that context has no tags — so every file behind a `//go:build` tag
# is not merely unlinted, it is never opened. That is not a weaker check on those
# files; it is no check at all, and it is silent: the run prints `0 issues` and
# exits 0 exactly as it would over a clean file.
#
# Measured on 2026-08-18, matched pair, same package, same statement
# (`os.Setenv(...)` with the error dropped): planted in
# internal/servarr/specdrift_upstream_test.go (`//go:build upstream`) golangci-lint
# reported `0 issues`, exit 0; planted in an untagged _test.go beside it, exit 1
# with the errcheck finding. One defect, two verdicts, decided by a build tag.
#
# The Makefile's `build-tagged` target is NOT this. It runs `go build -tags=bench`
# and `go vet -tags=upstream`, which type-check the hidden files — that closes the
# COMPILE hole (a deliberate type error used to pass the whole gate) and closes
# nothing else. errcheck, bodyclose, noctx, gosec and the rest live here, and
# type-checking a file is not linting it.
#
# errcheck-class defects are the point: the *Arr API keys this repo handles are
# full-admin credentials, and CLAUDE.md's rule is that unchecked errors are how
# credential-handling bugs hide. Leaving one file structurally exempt from the
# linter that catches them is the wrong file to leave exempt.
#
# KEEP THIS LIST IN STEP WITH THE TREE. `grep -rn "go:build" --include="*.go" .`
# names every tag in the repo; each one absent from this list is a file the gate
# does not lint.
#
# `bench` was added 2026-08-18 on the same matched pair, and it needed a third
# probe the `upstream` case did not. The same dropped `os.Setenv` planted in
# internal/db/pragma_spike.go (`//go:build bench`) and in the untagged
# internal/db/sqlite.go beside it — one package, `db` — gave ONE errcheck
# finding before the tag was added, the untagged one, and TWO after, with the
# control still firing. But that pair only proves the tagged file of an
# already-linted package is opened; internal/db/spike is its own package and
# `go list ./...` never names it, so a third probe was planted in
# internal/db/spike/workload.go and confirmed to fire. The tagged code was
# already clean — the real run is 0 issues — so nothing was suppressed, no
# exclusion was widened and no `nolint` was added to land this.
#
# ONE RESIDUAL GAP, named rather than left to be rediscovered:
# internal/db/spike/rss_other.go is `bench && !linux`, and no build-tag list can
# open it on a linux runner. GOOS excludes it, not tags — and `make build-tagged`
# does not compile it here either, so on this CI it is neither linted nor
# type-checked. Closing that needs a cross-GOOS pass, not an entry in this list.
run:
  build-tags:
    - upstream
    - bench

linters:
  default: standard
  enable:
    - errcheck # unchecked errors are how credential-handling bugs hide
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose # UsArr makes a LOT of outbound HTTP; leaked bodies leak sockets
    - noctx # every outbound request must carry a context with a timeout
    - errorlint
    - gosec
    - sqlclosecheck
    - rowserrcheck
  exclusions:
    rules:
      # Test code asserts on hardcoded fixture credentials and deliberately
      # malformed inputs; gosec's credential and error-handling heuristics fire
      # on both. Fixture keys are structurally impossible to mistake for real
      # ones (docs/DEVELOPMENT.md §7.1).
      - path: _test\.go
        linters:
          - gosec
# A gate that hides findings is a gate nobody can trust. golangci-lint defaults
# to max-same-issues: 3 and max-issues-per-linter: 50, so a repeated finding is
# reported a few times and the rest are dropped SILENTLY — no "N more" line, no
# non-zero difference in the summary. That is not hypothetical here: this repo
# carried 7 noctx findings that a default run displayed as 3, so fixing the three
# on screen would have looked like finishing the job while four remained. 0 means
# unlimited. Do not restore the defaults to make the output shorter.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofumpt
    - goimports
